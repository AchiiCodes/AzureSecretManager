name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Analyzes commits since the last tag (Conventional Commits), bumps
      # package.json, commits "[skip ci]", tags v<version>, and creates a
      # GitHub Release. That tag push then triggers build.yml, which builds
      # the installers and uploads them to this same release.
      - name: Version, tag, and release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
